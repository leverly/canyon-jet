<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%2317404a%27/%3E%3Ccircle cx=%2716%27 cy=%2714%27 r=%277%27 fill=%27%23f8d84a%27/%3E%3Cpath d=%27M4 20q4-3 8 0t8 0 8 0v8H4z%27 fill=%27%23f4f7f2%27/%3E%3C/svg%3E" />
<title>Canyon Jet · 红河峡谷喷射艇</title>
</head>
<body>
<canvas id="game"></canvas>
<div id="speedlines"></div>
<div id="hud" class="hidden">
  <div id="emblem">
    <svg viewBox="0 0 120 130" aria-hidden="true">
      <defs><clipPath id="sunclip"><rect x="0" y="0" width="120" height="66"/></clipPath></defs>
      <circle cx="60" cy="65" r="55" fill="#17404a" stroke="#a9c0c2" stroke-width="3"/>
      <circle cx="60" cy="65" r="49" fill="none" stroke="#0f2d35" stroke-width="2"/>
      <g clip-path="url(#sunclip)">
        <circle cx="60" cy="62" r="21" fill="#f8d84a"/>
        <g fill="#f8d84a">
          <path d="M60 22l4 12h-8z"/><path d="M33 33l11 8-6 5z"/><path d="M87 33l-5 13-6-5z"/>
          <path d="M22 57l13 0-2 7z"/><path d="M98 57l-11 7-2-7z"/><path d="M45 25l7 11-7 3z"/><path d="M75 25l0 14-7-3z"/>
        </g>
      </g>
      <g fill="none" stroke="#f4f7f2" stroke-width="5" stroke-linecap="round">
        <path d="M24 70q9-7 18 0t18 0 18 0 18 0"/><path d="M28 82q8-6 16 0t16 0 16 0 16 0"/><path d="M36 94q6-5 12 0t12 0 12 0 12 0"/>
      </g>
      <path d="M60 14l-6-9h12z" fill="#e8f0ee"/><path d="M60 116l-6 9h12z" fill="#e8f0ee"/>
    </svg>
    <div id="timer">0:00</div>
  </div>
  <div id="score"><span class="lbl">SCORE</span><span id="scoreVal">0</span></div>
  <div id="combo">x1</div>
  <div id="speed"><div class="in"><span class="lbl">SPEED</span><span id="speedVal">0</span><span class="unit">KM/H</span></div></div>
  <div id="boost"><span>BOOST</span><div class="bar"><i id="boostFill"></i></div></div>
  <div id="pos"><b id="posVal">4</b><small>/4</small><span id="gateVal">GATE 0/19</span></div>
  <div id="progress"><i></i><b class="d r1"></b><b class="d r2"></b><b class="d r3"></b><b class="d me"></b></div>
  <div id="center"></div>
  <div id="popups"></div>
  <div id="warn"></div>
</div>
<div id="touch" class="hidden">
  <button data-k="left">◀</button><button data-k="right">▶</button>
  <button data-k="brake" class="r2">刹</button><button data-k="boost" class="r1">BOOST</button>
</div>
<div id="corner"><button id="btnMute" title="静音 (M)">♪</button><button id="btnPause" title="暂停 (Esc)">Ⅱ</button></div>
<div id="menu" class="overlay">
  <div class="card">
    <h1>CANYON <em>JET</em></h1>
    <h2>红河峡谷 · 喷射艇竞速</h2>
    <p class="tag">穿过检查门，收集太阳币，飞越瀑布，抢在三位对手之前冲进泻湖。</p>
    <button id="btnStart" class="big">开始比赛</button>
    <div class="keys">
      <span><kbd>W</kbd>/<kbd>↑</kbd> 油门</span><span><kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> 转向</span><span><kbd>S</kbd>/<kbd>↓</kbd> 刹车</span>
      <span><kbd>空格</kbd> 加速</span><span><kbd>R</kbd> 复位</span><span><kbd>C</kbd> 视角</span><span><kbd>Esc</kbd> 暂停</span><span><kbd>M</kbd> 静音</span>
    </div>
    <div class="row"><label>画质</label><div id="quality"><button data-q="0">低</button><button data-q="1">中</button><button data-q="2">高</button></div><span id="best"></span></div>
  </div>
</div>
<div id="pause" class="overlay hidden"><div class="card small"><h1>暂停</h1><button id="btnResume" class="big">继续</button><button id="btnRestart2">重新开始</button><button id="btnMenu2">返回标题</button></div></div>
<div id="results" class="overlay hidden"><div class="card"><h1 id="resTitle">FINISH</h1><div id="resMedal"></div><table id="resTable"></table><button id="btnRestart" class="big">再来一局</button><button id="btnMenu">返回标题</button></div></div>
<div id="loading">LOADING…</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
